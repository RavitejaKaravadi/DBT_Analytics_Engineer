# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "dbt_analytics_engineer"
version: "1.0.0"

profile: "dbt_analytics_engineer"

# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  ["targets", "dbt_packages"] # directories to be removed by `dbt clean`
  # - "target"
  # - "dbt_packages"

flags:
  { fail-fast: true }
  # fail-fast: true

seeds:
  +database: seeds
  +schema: static

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  dbt_analytics_engineer:
    +materialized: table
    +tags: ["dbt_analytics_engineer", "revamp_retro"]
    marts:
      +materialized: view
      +tags:
        - mart_specific
        - mart_view
      +schema: marts
      stablecoin_activity_per_day:
        +post-hook:
          - GRANT USAGE ON DATABASE DBT TO ROLE TESTER
          - GRANT USAGE ON SCHEMA DBT_KRT_MARTS TO ROLE TESTER
          - GRANT USAGE ON DATABASE DBT TO ROLE BA
          - GRANT USAGE ON SCHEMA DBT_KRT_MARTS TO ROLE BA
      +grants:
        select: ['BA']
vars:
  token_name_var: "tron"
  token_address_var: "0x50327c6c5a14DCaDE707ABad2E27eB517df87AB5"
  token_decimals_var: "6"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ["dbt_analytics_engineer", "dbt_utils"]
